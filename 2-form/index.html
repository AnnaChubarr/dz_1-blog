<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Форма регистрации</title>
    <link rel="stylesheet" href="./style.css">
</head>
<body>
    <main>
        <div class="container">
        <section>
            <div class="registration">
                 <h1>Регистрация</h1>
                 <p>Уже есть аккаунт? <a href="#">Войти</a></p>
            </div>
        <form action="#" class="main_section">
            <input type="text" id="company" name="company" class="company" placeholder="Моя компания">
            <div>
                <input type="text" placeholder="Имя" name="name" required class="input input1">
                <input type="text" placeholder="Фамилия" name="surname" required class="input input2">
            </div>
                <input type="email" name="email" id="email" required placeholder="E-mail" class="input input3">
            <button>Зарегистрироваться</button>
            <div>
                <input type="checkbox" name="agree" id="agree" required class="check">
                <label for="agree">Я прочитал и принимаю <a href="#">Условия использования</a></label>
            </div>
        </form>
    </section>
</div>
    </main>
</body>
</html>
